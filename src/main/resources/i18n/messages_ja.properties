help.title=使い方
help.body=<html><body style='font-family:sans-serif;font-size:12px'><h3>eyePageFlow の使い方</h3><p><b>閲覧</b></p><ul><li>→／PgDn／空白／右半分をクリック（縦書きは左半分）：次のページ</li><li>←／PgUp／Backspace／↑：前のページ、↓：次のページ</li><li>ホイール一格で一ページ、右側のスクロールバーで移動</li><li>Home／End：ファイルの先頭／末尾</li><li>Ctrl+←／Ctrl+→：閲覧履歴の戻る／進む</li><li>F3：次を検索（先に検索語を入力）</li><li>Esc：ボスキー（トレイまたは最小化）</li></ul><p><b>編集</b></p><ul><li>Ctrl+E：閲覧と編集の切り替え</li><li>空白：次のページ、Shift+空白：空白を挿入</li><li>Ctrl+X／C／V／A：切り取り／コピー／貼り付け／すべて選択</li><li>Ctrl+Z／Ctrl+Y：元に戻す／やり直し</li><li>Ctrl+F／Ctrl+R：検索／置換</li></ul><p><b>その他</b></p><ul><li>Ctrl+O／Ctrl+S：開く／保存</li><li>Ctrl+T：表示設定、Ctrl+P：章の一覧</li><li>Ctrl+B／Ctrl+G：しおりを追加／しおりの管理</li><li>Ctrl+W／Ctrl+H：ファイル一覧／既定の本棚</li><li>Ctrl+Shift+V：縦書き／横書き</li><li>F1：この使い方</li></ul></body></html>
