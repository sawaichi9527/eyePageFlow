help.title=User Guide
help.body=<html><body style='font-family:sans-serif;font-size:12px'><h3>eyePageFlow User Guide</h3><p><b>Reading</b></p><ul><li>Right / PgDn / Space / click the right half (left half in vertical): next page</li><li>Left / PgUp / Backspace / Up: previous page; Down: next page</li><li>Mouse wheel turns one page; drag the scroll bar on the right to jump</li><li>Home / End: start / end of file</li><li>Ctrl+Left / Ctrl+Right: back / forward through reading history</li><li>F3: find next (type the term in find first)</li><li>Esc: boss key (tray or minimize)</li></ul><p><b>Editing</b></p><ul><li>Ctrl+E: switch between reading and editing</li><li>Space: next page; Shift+Space: insert a space</li><li>Ctrl+X / C / V / A: cut / copy / paste / select all</li><li>Ctrl+Z / Ctrl+Y: undo / redo</li><li>Ctrl+F / Ctrl+R: find / replace</li></ul><p><b>Other</b></p><ul><li>Ctrl+O / Ctrl+S: open / save</li><li>Ctrl+T: display settings; Ctrl+P: chapter list</li><li>Ctrl+B / Ctrl+G: add bookmark / manage bookmarks</li><li>Ctrl+W / Ctrl+H: file list / default shelf</li><li>Ctrl+Shift+V: vertical / horizontal</li><li>F1: this guide</li></ul></body></html>
