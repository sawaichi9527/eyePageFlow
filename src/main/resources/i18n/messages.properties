about.body=eyePageFlow %s\nPageByPage 功能復刻原型\nJava %s
help.title=使用說明
help.body=<html><body style='font-family:sans-serif;font-size:12px'><h3>eyePageFlow 使用說明</h3><p><b>閱讀模式</b></p><ul><li>→／PgDn／空白／點擊右半頁（直排點左半頁）：下一頁</li><li>←／PgUp／Backspace／↑：上一頁；↓：下一頁</li><li>滑鼠滾輪一格一頁；右側捲軸可直接拖到任一頁</li><li>Home／End：檔案頭／檔案尾</li><li>Ctrl+←／Ctrl+→：閱讀歷程後退／前進</li><li>F3：尋找下一個（先在編輯模式輸入關鍵字）</li><li>Esc：老闆鍵（縮到托盤或最小化）</li></ul><p><b>編輯模式</b></p><ul><li>Ctrl+E：切換閱讀／編輯</li><li>空白鍵：下一頁；Shift+空白：插入空白</li><li>Ctrl+X／C／V／A：剪下／複製／貼上／全選</li><li>Ctrl+Z／Ctrl+Y：復原／重做</li><li>Ctrl+F／Ctrl+R：尋找／取代</li></ul><p><b>其他</b></p><ul><li>Ctrl+O／Ctrl+S：開啟／儲存</li><li>Ctrl+T：顯示設定；Ctrl+P：章節列表</li><li>Ctrl+B／Ctrl+G：加入書籤／書籤管理</li><li>Ctrl+W／Ctrl+H：檔案列表／預設書架</li><li>Ctrl+Shift+V：直排／橫排</li><li>F1：這份說明</li></ul></body></html>
